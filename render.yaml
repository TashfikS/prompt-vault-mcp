services:
  - type: web
    name: prompthold-mcp
    runtime: docker
    plan: free
    branch: dev
    healthCheckPath: /api/health
    envVars:
      - key: PROMPT_HOLD_ENV
        value: production
      - key: SEED_DEMO_DATA
        value: "false"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: NEON_DATABASE_URL
        sync: false
      - key: SUPABASE_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GITHUB_ISSUE_REPO
        sync: false
      - key: GITHUB_ISSUE_TOKEN
        sync: false
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GATEWAY_SECRET
        sync: false

