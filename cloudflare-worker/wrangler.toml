name = "prompt-vault-gateway"
main = "worker.js"
compatibility_date = "2024-11-01"
# promptfolders Cloudflare account (CI may override with CLOUDFLARE_ACCOUNT_ID).
account_id = "02e0a5cc51ca5d4d0ebdc9420add8095"
workers_dev = true

# Public API address. Cloudflare creates the DNS record and certificate on first deploy.
[[routes]]
pattern = "api.promptfolders.com"
custom_domain = true

# Let MCP clients use the brand domain too (https://promptfolders.com/mcp). Only these paths go to the
# gateway; everything else on promptfolders.com stays on Cloudflare Pages. Worker routes run before Pages.
# The Worker forwards X-Forwarded-Host, so OAuth metadata on this host advertises promptfolders.com URLs.
[[routes]]
pattern = "promptfolders.com/mcp*"
zone_name = "promptfolders.com"

[[routes]]
pattern = "promptfolders.com/sse*"
zone_name = "promptfolders.com"

[[routes]]
pattern = "promptfolders.com/oauth/*"
zone_name = "promptfolders.com"

[[routes]]
pattern = "promptfolders.com/.well-known/oauth-*"
zone_name = "promptfolders.com"

[vars]
RENDER_ORIGIN = "https://prompthold-backend.onrender.com"
# Non-API paths redirect here (the web app is served by Cloudflare Pages).
APP_ORIGIN = "https://promptfolders.com"

# Secret (set with `npx wrangler secret put GATEWAY_SECRET`): must equal GATEWAY_SECRET on Render.

[triggers]
crons = ["*/14 * * * *"]
