name: CI/CD Pipeline (Test & Deploy)

on:
  push:
    branches:
      - dev
      - release
    tags: ["v*.*.*"]
  pull_request:
    branches:
      - dev
      - release
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  checks: write
  security-events: write

jobs:
  # ============================================================================
  # STAGE 1: VERIFICATION & TEST PIPELINE (Runs on every push & pull request)
  # ============================================================================

  # 1.1 Backend Lint, Syntax & Static Security
  backend-lint-security:
    name: 1. Backend Lint & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.15
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt ruff bandit

      - name: Compile Python bytecode (syntax check)
        run: python -m py_compile backend/*.py backend/tests/*.py

      - name: Run Ruff linter on backend
        run: ruff check backend --select=E9,F63,F7,F82

      - name: Run Bandit static security analysis
        run: bandit -r backend -x backend/tests -ll -ii

  # 1.2 Backend Unit & Integration Tests (SQLite + PostgreSQL 16 + Redis 7)
  backend-tests:
    name: 2. Backend Tests (${{ matrix.db_backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db_backend: [sqlite, postgres]
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: promptvault
          POSTGRES_PASSWORD: promptvault_test_pw
          POSTGRES_DB: promptvault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.15
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-cov pytest-asyncio

      - name: Run Pytest suite (${{ matrix.db_backend }})
        working-directory: backend
        env:
          REDIS_URL: redis://localhost:6379/0
          DATABASE_URL: ${{ matrix.db_backend == 'postgres' && 'postgresql+psycopg://promptvault:promptvault_test_pw@localhost:5432/promptvault_test' || 'sqlite:///./test_ci.db' }}
          PGVECTOR_TEST_DATABASE_URL: ${{ matrix.db_backend == 'postgres' && 'postgresql+psycopg://promptvault:promptvault_test_pw@localhost:5432/promptvault_test' || '' }}
        run: |
          pytest -v --cov=. --cov-report=term-missing

      - name: Verify database seed & schema migration on ${{ matrix.db_backend }}
        working-directory: backend
        env:
          REDIS_URL: redis://localhost:6379/0
          DATABASE_URL: ${{ matrix.db_backend == 'postgres' && 'postgresql+psycopg://promptvault:promptvault_test_pw@localhost:5432/promptvault_test' || 'sqlite:///./seed_verify.db' }}
        run: |
          python -c "
          from database import Base, engine, SessionLocal
          from auth import upgrade_schema
          from seed import seed_initial_data as seed_database
          from models import User
          Base.metadata.create_all(bind=engine)
          upgrade_schema(engine)
          with SessionLocal() as db:
              seed_database(db)
              count = db.query(User).count()
              assert count >= 13, f'Expected at least 13 seeded users, found {count}'
              print(f'Successfully migrated and seeded {count} demo accounts on ${{ matrix.db_backend }}!')
          "

  # 1.3 Frontend Type Check, Unit Tests, UI Guardrails & Production Build
  frontend-verify:
    name: 3. Frontend TypeScript, Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Enforce AGENTS.md Rule #5 (No native OS dialogs or <select>/<datalist>)
        run: |
          if grep -rnE "<select|<datalist|window\.(alert|confirm|prompt)\(" frontend/src/; then
            echo "ERROR: Native OS select/datalist or browser dialog found in frontend/src/ (violates AGENTS.md §6 Rule 5)"
            exit 1
          fi
          echo "UI guardrail check passed: 0 native OS dialogs or <select>/<datalist> elements."

      - name: Run TypeScript compiler check (npx tsc -b --noEmit)
        working-directory: frontend
        run: npx tsc -b --noEmit

      - name: Run Frontend Unit & Diff Engine Tests
        working-directory: frontend
        run: npm test

      - name: Build production frontend bundle
        working-directory: frontend
        run: npm run build

      - name: Upload production frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # 1.4 Full-Stack Docker Smoke Test
  docker-smoke-test:
    name: 4. Docker Multi-Stage Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-verify]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: prompt-vault-mcp:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container and run live HTTP smoke tests
        run: |
          docker run -d --name pv-smoke -p 7860:7860 \
            -e SEED_DEMO_DATA=true \
            -e DATABASE_URL=sqlite:////tmp/smoke_vault.db \
            prompt-vault-mcp:ci-test

          echo "Waiting for container health endpoint..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:7860/api/health > /tmp/health.json 2>/dev/null; then
              cat /tmp/health.json
              break
            fi
            sleep 1
          done

          grep -q '"status":"ok"' /tmp/health.json
          grep -q '"database":"connected"' /tmp/health.json
          curl -fsS http://localhost:7860/ | grep -qi "<!doctype html>"
          echo "Docker E2E smoke test passed!"

      - name: Stop and remove smoke container
        if: always()
        run: docker rm -f pv-smoke || true

  # ============================================================================
  # STAGE 2: CONTINUOUS DEPLOYMENT (Only triggers after ALL tests pass on main)
  # ============================================================================

  # 2.1 Publish Multi-Platform Image to GitHub Container Registry (GHCR) (Production)
  publish-ghcr:
    name: 5. Deploy Docker Image to GHCR (Production)
    runs-on: ubuntu-latest
    needs: [backend-lint-security, backend-tests, frontend-verify, docker-smoke-test]
    if: (github.ref == 'refs/heads/release' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2.2 Trigger Render Production Deployment
  deploy-render:
    name: 6. Deploy to Render Backend Web Service (Production)
    runs-on: ubuntu-latest
    needs: [publish-ghcr]
    if: (github.ref == 'refs/heads/release' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          CLEAN_URL=$(python3 -c "import os, re; s = os.getenv('RENDER_DEPLOY_HOOK_URL', ''); m = re.search(r'https?://[^\s\"\'\`<>]+', s); print(m.group(0) if m else '')")
          if [ -z "${CLEAN_URL}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret not set or does not contain a valid URL. Skipping Render trigger."
          else
            echo "Calling Render deploy hook..."
            if curl -fsSL -X POST "${CLEAN_URL}"; then
              echo "Triggered Render production deployment successfully!"
            else
              echo "::warning::Render deploy hook call failed. Please check RENDER_DEPLOY_HOOK_URL in GitHub Secrets."
            fi
          fi

  # 2.3 Deploy Dev to Cloudflare Pages (Development Account - dev branch)
  deploy-cloudflare-dev:
    name: 7. Deploy to Cloudflare Pages (Dev Environment)
    runs-on: ubuntu-latest
    needs: [backend-lint-security, backend-tests, frontend-verify, docker-smoke-test]
    if: github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Cloudflare Dev credentials
        id: check_cf_dev
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CF_API_TOKEN}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "Neither CLOUDFLARE_DEV_API_TOKEN nor CLOUDFLARE_API_TOKEN is set. Skipping Dev deploy."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js 26
        if: steps.check_cf_dev.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Deploy Frontend to Cloudflare Pages (Dev Branch)
        if: steps.check_cf_dev.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd frontend
          npm ci
          npm run build
          npx wrangler pages deploy dist --project-name promptfolders --branch dev
          echo "Successfully deployed to Dev Cloudflare Pages (*.pages.dev)!"

  # 2.4 Deploy Production to Cloudflare Pages & Gateway (Production Account - release branch)
  deploy-cloudflare-prod:
    name: 8. Deploy to Cloudflare Pages & Gateway (Production Environment)
    runs-on: ubuntu-latest
    needs: [backend-lint-security, backend-tests, frontend-verify, docker-smoke-test]
    if: (github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Cloudflare Prod credentials
        id: check_cf_prod
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_PROD_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CF_API_TOKEN}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "Neither CLOUDFLARE_PROD_API_TOKEN nor CLOUDFLARE_API_TOKEN is set. Skipping Production deploy."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js 26
        if: steps.check_cf_prod.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Deploy Frontend to Cloudflare Pages (Production)
        if: steps.check_cf_prod.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PROD_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PROD_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd frontend
          npm ci
          npm run build
          npx wrangler pages deploy dist --project-name promptfolders --branch release
          echo "Successfully deployed frontend to Production Cloudflare Pages (release branch)!"

      - name: Deploy Gateway & Automated Cron Triggers to Cloudflare Worker
        if: steps.check_cf_prod.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PROD_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PROD_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd cloudflare-worker
          npm ci
          npx wrangler deploy
          echo "Successfully deployed Cloudflare Worker gateway and scheduled cron triggers to Production!"


