name: Browser E2E QA Pipeline

on:
  workflow_run:
    workflows: ["CI/CD Pipeline (Test & Deploy)"]
    types:
      - completed
    branches:
      - dev
      - release
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Frontend base URL to test'
        required: false
        default: 'https://prompthold.pages.dev'
      api_base:
        description: 'API gateway base URL to test'
        required: false
        default: 'https://prompt-vault-gateway.tashfiks.workers.dev'

concurrency:
  group: browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e-tests:
    name: Live Browser E2E QA (21 Features)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify Google Chrome installation
        run: |
          which google-chrome || which chromium-browser || which chromium
          google-chrome --version || true

      - name: Run 21-Feature Browser E2E Live QA Suite
        working-directory: frontend
        env:
          E2E_BASE_URL: ${{ inputs.base_url || 'https://prompthold.pages.dev' }}
          E2E_API_BASE: ${{ inputs.api_base || 'https://prompt-vault-gateway.tashfiks.workers.dev' }}
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run test:e2e

