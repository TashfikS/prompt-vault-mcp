name: Browser E2E QA Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e-tests:
    name: Live Browser E2E QA (21 Features)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Verify Google Chrome installation
        run: |
          which google-chrome || which chromium-browser || which chromium
          google-chrome --version || true

      - name: Run 21-Feature Browser E2E Live QA Suite
        working-directory: frontend
        env:
          E2E_BASE_URL: https://prompthold.pages.dev
          E2E_API_BASE: https://prompt-vault-gateway.tashfiks.workers.dev
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run test:e2e
