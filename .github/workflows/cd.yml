name: Continuous Deployment (CD)

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Deployment targets to trigger (all, ghcr, huggingface, render)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - ghcr
          - huggingface
          - render

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 1. Build & Push Multi-Platform Container Image to GitHub Container Registry (GHCR)
  publish-ghcr:
    name: Build & Push Docker Image (GHCR)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.deploy_target == '' || github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'ghcr' }}
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2. Automated Sync & Deploy to Hugging Face Spaces (Docker Space)
  deploy-huggingface:
    name: Deploy to Hugging Face Spaces
    runs-on: ubuntu-latest
    needs: [publish-ghcr]
    if: ${{ (github.event.inputs.deploy_target == '' || github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'huggingface') && secrets.HF_TOKEN != '' && secrets.HF_SPACE_REPO != '' }}
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push repository to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ secrets.HF_SPACE_REPO }}
        run: |
          git config user.name "PromptVault CD Bot"
          git config user.email "cd-bot@promptvault.local"
          git push --force "https://huggingface.co/spaces/${HF_SPACE_REPO}" HEAD:main

  # 3. Automated Render Web Service Deployment via Deploy Hook
  deploy-render:
    name: Trigger Render Production Deploy
    runs-on: ubuntu-latest
    needs: [publish-ghcr]
    if: ${{ (github.event.inputs.deploy_target == '' || github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'render') && secrets.RENDER_DEPLOY_HOOK_URL != '' }}
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -fsSL -X POST "${RENDER_DEPLOY_HOOK_URL}"
          echo "Triggered Render deployment successfully."
